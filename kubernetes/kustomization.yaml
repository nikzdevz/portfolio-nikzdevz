# ===========================================
# Kubernetes Kustomization
# ===========================================
# Use: kubectl apply -k . or kubectl kustomize .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nikzdevz

resources:
  - namespace.yaml
  - configmap.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
  - hpa.yaml
  - network-policy.yaml

commonLabels:
  app: nikzdevz
  managed-by: kustomize

images:
  - name: nikzdevz-frontend
    newTag: latest

# Backends and MySQL removed during the frontend-only migration.
# Previously managed: namespace.yaml, serviceaccount.yaml, mysql-*.yaml,
# backend-*.yaml (kept in git history).
