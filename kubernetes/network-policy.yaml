# ===========================================
# Kubernetes Network Policy - Frontend
# ===========================================
# Frontend-only network policy after the Flask backend and MySQL database were removed.
# All ports referencing backend (5000) or MySQL (3306) were removed.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nikzdevz-network-policy
  namespace: nikzdevz
  labels:
    app: nikzdevz
    component: network
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from ingress controller (nginx)
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow external HTTP/HTTPS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
