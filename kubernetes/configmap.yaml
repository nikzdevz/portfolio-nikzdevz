# ===========================================
# Kubernetes ConfigMap - Frontend Application Configuration
# ===========================================
# Frontend-only config after the Flask backend and MySQL database were removed.
# Remaining keys are consumed by the Nginx-hosted React/Vite build.

apiVersion: v1
kind: ConfigMap
metadata:
  name: nikzdevz-config
  namespace: nikzdevz
  labels:
    app: nikzdevz
    component: config
data:
  # Frontend Configuration
  FRONTEND_PORT: "3000"
