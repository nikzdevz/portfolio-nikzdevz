# ===========================================
# nikzdevz Portfolio - Docker Compose
# ===========================================
# Frontend-only orchestration after the Flask backend and MySQL database were removed.
# Single Nginx-hosted React/Vite build; the old three-service stack
# (frontend -> backend -> mysql) is gone.

services:
  # ===========================================
  # Frontend Service (React + Nginx)
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nikzdevz-frontend
    restart: unless-stopped
    ports:
      # No .env file is required; override the host port with FRONTEND_PORT.
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true

# ===========================================
# Volumes
#
# Removed: mysql_data (no longer needed without the database).
# ===========================================

# ===========================================
# Networks
#
# Removed: nikzdevz-network (only used for backend/db inter-service traffic).
# ===========================================
